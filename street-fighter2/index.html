<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Fighter II: Ecuador Edition - Phaser 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    header {
      margin-bottom: 12px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: #fbbf24;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8);
    }

    .instructions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #cbd5e1;
      max-width: 820px;
    }

    .instructions span {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .instructions kbd {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-weight: bold;
      color: #f1f5f9;
    }

    #game-container {
      border: 3px solid #334155;
      border-radius: 10px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      background: #000;
      line-height: 0;
    }

    canvas {
      display: block;
    }
  </style>
  <!-- Importación de Phaser 3 vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>

<body>
  <header>
    <h1>Street Fighter II: Ecuador Edition</h1>
    <div class="instructions">
      <span>
        <strong style="color: #38bdf8;">P1:</strong>
        <kbd>A</kbd>/<kbd>D</kbd> Mover | <kbd>W</kbd> Saltar | <kbd>Espacio</kbd>/<kbd>F</kbd> Golpe | <kbd>J</kbd> ⚡
        Poder
      </span>
      <span>
        <strong style="color: #f87171;">P2:</strong>
        <kbd>←</kbd>/<kbd>→</kbd> Mover | <kbd>↑</kbd> Saltar | <kbd>Enter</kbd>/<kbd>L</kbd> Golpe | <kbd>P</kbd> ⚡
        Poder
      </span>
      <span>
        <kbd>R</kbd> Revancha | <kbd>ESC</kbd> Volver a Selección
      </span>
    </div>
  </header>

  <!-- Contenedor del lienzo de 800x600 -->
  <div id="game-container"></div>

  <!-- Lógica estática del juego -->
  <script src="game.js"></script>
</body>

</html>
